services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_KEY: "${API_KEY:?Set API_KEY in .env before starting the container}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
